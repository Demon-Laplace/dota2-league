<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOTA2 宁德联赛</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h1>DOTA2 宁德联赛</h1>

  <section>
    <h2>排行榜</h2>
    <button id="loadLeaderboard">刷新排行榜</button>
    <div id="leaderboard"></div>
  </section>

  <section>
    <h2>玩家报名</h2>
    <button id="loadPlayers">加载玩家</button>
    <div id="players"></div>
  </section>

  <section>
    <h2>当前队列</h2>
    <button id="loadQueue">刷新队列</button>
    <div id="queue"></div>
  </section>

  <script type="module" src="./app.js"></script>
</body>
</html>
