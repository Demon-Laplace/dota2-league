name: Configure champion publisher
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provision user-approved GitHub publication credential
        run: node scripts/configure-champion-publisher.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          CHAMPION_PUBLICATION_BOOTSTRAP_TOKEN: ${{ secrets.CHAMPION_PUBLICATION_BOOTSTRAP_TOKEN }}
      - name: Always delete the temporary credential copy
        if: always()
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret delete CHAMPION_PUBLICATION_BOOTSTRAP_TOKEN --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ secrets.CHAMPION_PUBLICATION_BOOTSTRAP_TOKEN }}
