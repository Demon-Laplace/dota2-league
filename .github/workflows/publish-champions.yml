name: Publish missing season champions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-champions.yml'
      - 'scripts/publish-missing-champions.mjs'
      - 'supabase/functions/publish-season-champion/champion.mjs'

concurrency:
  group: publish-season-champions
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check champion publication safeguards
        run: node --test scripts/champions.test.mjs scripts/publish-missing-champions.test.mjs
      - name: Publish missing ended-season champions
        run: node scripts/publish-missing-champions.mjs
        env:
          GH_TOKEN: ${{ github.token }}
