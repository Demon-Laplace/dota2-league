# Version 1.0 workflow definition.
name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: |
          deploy_function() {
            local name="$1"
            shift
            local attempt

            for attempt in 1 2 3; do
              if supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID" "$@"; then
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done

            return 1
          }

          deploy_function username-login --no-verify-jwt

          for dir in supabase/functions/*; do
            if [ -d "$dir" ] && [ "$(basename "$dir")" != "_shared" ] && [ "$(basename "$dir")" != "username-login" ]; then
              deploy_function "$(basename "$dir")"
            fi
          done
