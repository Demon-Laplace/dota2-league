# Version 1.0 workflow definition.
name: Deploy Supabase DB

on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/config.toml"
      - ".github/workflows/deploy-db.yml"
      - ".github/scripts/supabase_deployment.py"
      - ".github/scripts/test_supabase_deployment.py"
  workflow_dispatch:
    inputs:
      target:
        description: "Production follows the current Pages source branch; development requires a separate project."
        required: true
        default: development
        type: choice
        options:
          - development
          - production

jobs:
  deployment-target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      target: ${{ steps.target.outputs.target }}
      pages_branch: ${{ steps.target.outputs.pages_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test deployment guard
        run: python3 -m unittest discover -s .github/scripts -p 'test_supabase_deployment.py'
      - name: Resolve deployment target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: python3 .github/scripts/supabase_deployment.py resolve

  deploy-db:
    needs: deployment-target
    if: needs.deployment-target.outputs.target != 'skip'
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-deploy-${{ needs.deployment-target.outputs.target }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      pages: read
    env:
      DEPLOYMENT_TARGET: ${{ needs.deployment-target.outputs.target }}
      EXPECTED_PAGES_BRANCH: ${{ needs.deployment-target.outputs.pages_branch }}
      REQUESTED_TARGET: ${{ inputs.target }}
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DEV_PROJECT_ID: ${{ vars.SUPABASE_DEV_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets[needs.deployment-target.outputs.target == 'production' && 'SUPABASE_ACCESS_TOKEN' || 'SUPABASE_DEV_ACCESS_TOKEN'] }}
      SUPABASE_DB_PASSWORD: ${{ secrets[needs.deployment-target.outputs.target == 'production' && 'SUPABASE_DB_PASSWORD' || 'SUPABASE_DEV_DB_PASSWORD'] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check target and credentials
        run: python3 .github/scripts/supabase_deployment.py check --database

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push migrations
        run: |
          set -euo pipefail
          python3 .github/scripts/supabase_deployment.py check --database
          supabase db push --linked
